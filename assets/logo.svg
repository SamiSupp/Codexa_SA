<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="hexStroke" x1="10%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="80%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="sStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Hexagon outline (pointy-top) -->
  <polygon points="100,12 178,56 178,144 100,188 22,144 22,56"
           stroke="url(#hexStroke)" stroke-width="10" stroke-linejoin="round" fill="none"/>

  <!-- Stylized circuit "S" -->
  <path d="M134 62
           C134 52, 122 46, 104 46
           C84 46, 70 56, 70 74
           C70 90, 86 96, 100 100
           C114 104, 130 110, 130 128
           C130 146, 116 156, 96 156
           C82 156, 70 150, 70 138"
        stroke="url(#sStroke)" stroke-width="11" stroke-linecap="round" fill="none"/>

  <!-- Vertical antenna line on top of S -->
  <line x1="100" y1="100" x2="100" y2="64" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round"/>

  <!-- Circuit nodes -->
  <circle cx="100" cy="60" r="7" fill="#1E3A8A"/>
  <circle cx="70" cy="138" r="7" fill="#1E3A8A"/>
  <circle cx="134" cy="62" r="6" fill="#34D399"/>
</svg>
